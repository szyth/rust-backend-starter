[workspace]
members = ["service", "db"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["json"] }
tracing-forest = { version = "0.1.6", features = ["ansi", "serde", "tokio"] }
thiserror = "1.0.61"

[profile.release]
strip = true
