replicaCount: 2

image:
  # e.g. <account>.dkr.ecr.<region>.amazonaws.com/rust-backend-starter
  repository: ""
  # the git SHA the image was built from (ECR tags are immutable)
  tag: ""
  pullPolicy: IfNotPresent

# Existing Secret holding DATABASE_URL (created by the platform's db-secret.sh)
database:
  secretName: rust-backend-starter-db
  secretKey: DATABASE_URL

env:
  LOG_FORMAT: json
  LOG_LEVEL: info

containerPort: 8000

service:
  type: LoadBalancer
  port: 80
  annotations:
    # internet-facing Network Load Balancer in the public subnets
    service.beta.kubernetes.io/aws-load-balancer-type: nlb

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi

# keep at least one pod serving during node drains and upgrades
podDisruptionBudget:
  minAvailable: 1
