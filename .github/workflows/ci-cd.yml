# CI on every PR and push; on main also publish the image to ECR and deploy to EKS.
# AWS access is through GitHub OIDC: no AWS keys are stored in this repo.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_ROLE_ARN    IAM role trusted for this repo's main branch (from the platform repo)
#   AWS_REGION      e.g. ap-south-1
#   ECR_REPOSITORY  e.g. rust-backend-starter
#   EKS_CLUSTER     e.g. platform-starter-dev-eks
#   DEPLOY_TO_EKS   "true" while the cluster exists; anything else skips the deploy job
# Without AWS_ROLE_ARN only the ci job runs, so the template works for anyone.
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" button in the Actions tab, e.g. to fill an empty ECR after a fresh
  # terraform apply. Run it on main (the AWS role only trusts the main branch).
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Diesel's Postgres driver links against libpq
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # PRs prove the image still builds; main builds it in the publish job
      - if: github.event_name == 'pull_request'
        run: docker build -t rust-backend-starter:pr .

  publish:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token for AWS
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: meta
        run: |
          echo "image=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ECR tags are immutable: a re-run for the same commit reuses the existing image
      - id: exists
        run: |
          if aws ecr describe-images --repository-name "${{ vars.ECR_REPOSITORY }}" \
               --image-ids imageTag="${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@v3

      - if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: vars.DEPLOY_TO_EKS == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency: deploy-dev # one deploy at a time, never cancel a running one
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: azure/setup-helm@v4

      - run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER }}"

      # rolling update; --wait returns only when the new pods pass readiness (DB reachable)
      - run: |
          helm upgrade --install rust-api ./chart \
            --set image.repository="${{ needs.publish.outputs.image }}" \
            --set image.tag="${{ needs.publish.outputs.tag }}" \
            --set service.type=ClusterIP \
            --wait --timeout 5m

      - run: kubectl get pods -l app.kubernetes.io/name=rust-backend-starter -o wide
